<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Missionslandkarte Explorer</title>
  <meta name="description" content="Alle Projekte der EU-Missionen in Österreich — durchsuchbar und anklickbar." />
  <link rel="icon" href="assets/logos/5Missions_flower.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/explorer.css" />
</head>
<body>

  <!-- Kopfzeile wie in der Präsentation: dunkel, FFG-Logo links -->
  <header class="app-header">
    <a class="header-logo" href="./" aria-label="Missionslandkarte Explorer — Startansicht">
      <img src="assets/logos/FFG_white.png" alt="FFG" />
    </a>
    <span class="header-title">Missionslandkarte Explorer</span>
    <label class="header-search">
      <span class="visually-hidden">Projekt oder Organisation suchen</span>
      <input type="search" id="search-input" placeholder="Projekt oder Organisation suchen, z. B. BOKU" autocomplete="off" />
    </label>
    <button type="button" class="filter-toggle" id="filter-toggle" aria-controls="sidebar" aria-expanded="false">Filter</button>
  </header>

  <div class="app-body">
    <!-- Seitenleiste wie Folie 2: Umschalter, Legende mit Zahlen, Missionsblume -->
    <aside class="sidebar" id="sidebar" aria-label="Filter">
      <div class="legend-toggle" role="tablist">
        <button type="button" class="legend-toggle-btn active" data-view="mission" role="tab" aria-selected="true">Nach Mission</button>
        <button type="button" class="legend-toggle-btn" data-view="bundesland" role="tab" aria-selected="false">Nach Bundesland</button>
      </div>
      <div class="active-filters" id="active-filters" hidden></div>
      <div class="legend-list" id="legend-list"></div>

      <div class="sidebar-section">
        <span class="sidebar-section__title">Quelle</span>
        <div class="source-toggle" id="source-toggle" role="group" aria-label="Nach Quelle filtern"></div>
      </div>

      <p class="sidebar-counter" id="counter" aria-live="polite">Daten werden geladen …</p>

      <div class="legend-flower">
        <img src="assets/logos/5Missions_flower.svg" alt="" width="56" height="56" />
        <span class="legend-flower-label">Die 5 EU-Missionen</span>
        <span class="sidebar-meta" id="meta-line"></span>
        <span class="sidebar-version" id="version-line"></span>
      </div>
    </aside>

    <main class="map-area">
      <div id="map" class="map-container" aria-label="Karte der Beteiligungen"></div>
      <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
        <button type="button" class="tile-close panel__close" aria-label="Schließen">×</button>
        <div class="panel__content"></div>
      </aside>
    </main>
  </div>

  <pre id="selftest" hidden></pre>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
